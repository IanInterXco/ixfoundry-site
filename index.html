function LivingBlueprint({ t }) {
  // (Renamed the export but keeping the symbol name so call sites don't change.)
  return <WorkflowMorph t={t} />;
}

function WorkflowMorph({ t }) {
  const [tick, setTick] = React.useState(0);
  React.useEffect(() => {
    const i = setInterval(() => setTick(x => x + 1), 60);
    return () => clearInterval(i);
  }, []);

  // ── PHASES ────────────────────────────────────────────
  // BUILD (0-180):
  //   0-50    sketch draws in
  //   50-60   pause
  //   60-180  morph + build steps
  // OPERATE (180-540): live agent — self-improving, high velocity
  // RESET (540-560): brief fade
  const TOTAL = 560;
  const cycle = tick % TOTAL;

  const isBuild = cycle < 180;
  const isOperate = cycle >= 180 && cycle < 540;
  const isReset = cycle >= 540;

  const sketchDraw = Math.min(1, cycle / 30);
  let morph;
  if (cycle < 60) morph = 0;
  else if (cycle < 180) morph = (cycle - 60) / 120;
  else if (cycle < 540) morph = 1;
  else morph = 1 - (cycle - 540) / 20;
  morph = Math.max(0, Math.min(1, morph));

  // Operate sub-phase tick (resets at start of operate)
  const opTick = isOperate ? cycle - 180 : 0;

  // ── BUILD STEPS ────────────────────────────────────────
  const buildSteps = [
    { at: 60,  label: 'Reading whiteboard',       detail: 'Parsing 6 nodes · 5 connections' },
    { at: 72,  label: 'Identifying entities',     detail: 'Customer · Quote · Sale' },
    { at: 86,  label: 'Inferring data model',     detail: '3 tables · 7 fields · 2 relations' },
    { at: 100, label: 'Generating UI components', detail: 'CallIntake · NotesPanel · QuoteCard' },
    { at: 116, label: 'Wiring workflows',         detail: 'intake → triage → quote → close' },
    { at: 132, label: 'Adding AI assist',         detail: 'auto-summarize · suggest pricing' },
    { at: 148, label: 'Provisioning database',    detail: 'postgres · row-level security' },
    { at: 162, label: 'Deploying app',            detail: 'acme.ixfoundry.app' },
    { at: 176, label: 'Custom Intake live',          detail: '14 minutes elapsed · ready' },
  ];

  // ── OPERATE EVENTS ─────────────────────────────────────
  // Fast, varied events — agent monitoring, reacting, improving.
  // Each event has type (in/process/out/learn), label, detail.
  // We schedule one every ~6 ticks (360ms) for high velocity.
  const eventPool = [
    { type: 'in',      label: 'Inbound call',           detail: 'caller: Mercer Industrial' },
    { type: 'process', label: 'Transcribing audio',     detail: '0.4s · 98% confidence' },
    { type: 'process', label: 'Extracting requirements',detail: '14 line items detected' },
    { type: 'out',     label: 'Quote drafted',          detail: '$48,200 · sent to ops' },
    { type: 'in',      label: 'Email received',         detail: 'subject: re: PO #4471' },
    { type: 'learn',   label: 'Pattern detected',       detail: '+3% close rate after demo' },
    { type: 'process', label: 'Pricing model run',      detail: '2,140 SKUs · 90ms' },
    { type: 'out',     label: 'Auto-reply sent',        detail: 'thread: hartwell-co' },
    { type: 'in',      label: 'CRM sync',               detail: '47 records pulled' },
    { type: 'process', label: 'Triaging lead',          detail: 'priority: high · routed' },
    { type: 'learn',   label: 'Self-improved',          detail: 'reduced quote time -22%' },
    { type: 'out',     label: 'Invoice generated',      detail: 'INV-08821 · $12,400' },
    { type: 'in',      label: 'Slack mention',          detail: '@ops re: Mercer renewal' },
    { type: 'process', label: 'Risk scored',            detail: 'churn: 0.04 · stable' },
    { type: 'out',     label: 'Calendar booked',        detail: 'Thu 2pm · demo · Vance' },
    { type: 'in',      label: 'Webhook · Stripe',       detail: 'payment.succeeded · $4,800' },
    { type: 'learn',   label: 'Heuristic updated',      detail: 'tier-2 cutoff → $25k' },
    { type: 'process', label: 'Document parsed',        detail: 'PO.pdf · 4 pages · OK' },
    { type: 'out',     label: 'Approval requested',     detail: 'finance · waiting' },
    { type: 'in',      label: 'Voice memo · Sarah',     detail: '38s · attached to deal' },
    { type: 'learn',   label: 'Workflow optimized',     detail: 'skipped manual review' },
    { type: 'process', label: 'Forecast refresh',       detail: 'Q1 pipeline +8.4%' },
    { type: 'out',     label: 'Report dispatched',      detail: 'monday digest · 12 owners' },
    { type: 'in',      label: 'Form submitted',         detail: 'lead: westmark.co' },
  ];

  const visibleBuildSteps = buildSteps.filter(s => cycle >= s.at);
  const activeBuildStep = visibleBuildSteps[visibleBuildSteps.length - 1];

  // ── SELF-IMPROVEMENT MOMENT ────────────────────────────
  // Mid-operate the agent re-architects the workflow:
  // it identifies that step 3 (Pricing check) is redundant,
  // removes it, and rewires the connections.
  // Operate runs from cycle 180-540 (opTick 0-360).
  // Improvement window: opTick 130-200 (~4.2s).
  const IMPROVE_START = 130;
  const IMPROVE_FLAG = 130;   // card 3 starts pulsing as flagged
  const IMPROVE_REWRITE = 165; // card 3 actually fades out + lines redraw
  const IMPROVE_DONE = 200;   // post-improvement; faster cadence
  const isFlagging = opTick >= IMPROVE_FLAG && opTick < IMPROVE_REWRITE;
  const isRewriting = opTick >= IMPROVE_REWRITE && opTick < IMPROVE_DONE;
  const isImproved = opTick >= IMPROVE_REWRITE; // step 3 gone after this
  // Card 3 fade-out progress over 8 ticks at REWRITE
  const card3Fade = isImproved
    ? Math.min(1, (opTick - IMPROVE_REWRITE) / 8)
    : isFlagging ? 0 : 0;
  // Subtle reflow: cards shift slightly after step 3 removed
  const reflowProg = isImproved ? Math.min(1, (opTick - IMPROVE_REWRITE) / 14) : 0;

  // ── OPERATE EVENT SCHEDULE ─────────────────────────────
  // Pre-improvement: regular cadence (1 per 6 ticks).
  // Improvement window: scripted sequence of LEARN events + rewrite.
  // Post-improvement: faster cadence (1 per 4 ticks) — higher velocity.
  // We compute the visible event log by walking the schedule.
  const scriptedImproveEvents = [
    { atOpTick: 130, type: 'learn',   label: 'Bottleneck detected',  detail: 'step 3 idle 87% of runs' },
    { atOpTick: 142, type: 'learn',   label: 'Analyzing variants',   detail: 'reviewed 4,210 cases' },
    { atOpTick: 154, type: 'learn',   label: 'Optimization found',   detail: 'pricing inferable from intake' },
    { atOpTick: 165, type: 'process', label: 'Re-architecting',      detail: 'workflow v1.0 → v1.1' },
    { atOpTick: 175, type: 'process', label: 'Removed: Pricing check', detail: '−2.1s avg cycle' },
    { atOpTick: 188, type: 'out',     label: 'Workflow updated',     detail: '0 downtime · +34% throughput' },
  ];
  const eventLog = [];
  // Pre-improvement events (opTick 0..IMPROVE_FLAG-1, every 6 ticks)
  for (let t2 = 0; t2 < IMPROVE_FLAG; t2 += 6) {
    if (t2 > opTick) break;
    const evt = eventPool[(t2 / 6) % eventPool.length];
    eventLog.push({ ...evt, idx: eventLog.length, atOpTick: t2 });
  }
  // Scripted improvement events
  for (const evt of scriptedImproveEvents) {
    if (evt.atOpTick <= opTick) eventLog.push({ ...evt, idx: eventLog.length });
  }
  // Post-improvement events: faster cadence (every 4 ticks), starts after IMPROVE_DONE
  if (opTick >= IMPROVE_DONE) {
    let poolPtr = Math.floor(IMPROVE_FLAG / 6); // continue where we left off
    for (let t2 = IMPROVE_DONE; t2 <= opTick; t2 += 4) {
      const evt = eventPool[poolPtr % eventPool.length];
      eventLog.push({ ...evt, idx: eventLog.length, atOpTick: t2 });
      poolPtr++;
    }
  }
  const recentEvents = eventLog.slice(-4);

  // Live metrics that climb during operate.
  // Throughput jumps after self-improvement.
  const ops = isOperate
    ? Math.min((isImproved ? opTick * 6.2 + 50 : opTick * 4.7 + 12), 99999)
    : 0;
  const learnRate = isOperate ? Math.min(opTick * 0.18 + 2, 100) : 0;
  const throughputBase = isImproved ? 122 : 88;
  const throughputAmp = isImproved ? 14 : 12;
  const throughput = isOperate
    ? (Math.sin(opTick * (isImproved ? 0.22 : 0.15)) * throughputAmp + throughputBase).toFixed(0)
    : 0;

  // Sketch nodes
  const sketchNodes = [
    { id: 's1', label: 'Customer\ncalls in',  sx: 70,  sy: 90,  sw: 90, sh: 56 },
    { id: 's2', label: 'Sarah\ntakes notes',  sx: 215, sy: 70,  sw: 90, sh: 56 },
    { id: 's3', label: 'Pricing\ncheck',      sx: 350, sy: 130, sw: 90, sh: 56 },
    { id: 's4', label: 'Email\nquote',        sx: 215, sy: 220, sw: 90, sh: 56 },
    { id: 's5', label: 'Follow up',            sx: 70,  sy: 280, sw: 90, sh: 56 },
    { id: 's6', label: 'Close deal',           sx: 350, sy: 290, sw: 90, sh: 56 },
  ];
  const targetCards = [
    { tx: 30,  ty: 90,  tw: 195, th: 70 },
    { tx: 245, ty: 60,  tw: 195, th: 70 },
    { tx: 245, ty: 145, tw: 195, th: 80 },
    { tx: 30,  ty: 175, tw: 195, th: 60 },
    { tx: 30,  ty: 250, tw: 195, th: 95 },
    { tx: 245, ty: 240, tw: 195, th: 105 },
  ];
  const sketchPaths = [
    { sd: 'M 160 118 q 25 -15 55 -15', td: 'M 225 125 L 245 125' },
    { sd: 'M 305 98 q 25 25 45 50',   td: 'M 440 95 L 440 145' },
    { sd: 'M 350 158 q -50 30 -45 80',td: 'M 245 185 L 440 185' },
    { sd: 'M 215 248 q -50 10 -50 50',td: 'M 30 210 L 225 210' },
    { sd: 'M 160 308 q 90 5 195 -10', td: 'M 245 290 L 440 290' },
  ];

  const lerp = (a, b, k) => a + (b - a) * k;
  const W = 480, H = 400;

  // Which card lights up for the latest event (rotates fast).
  // After improvement, skip card index 2 (Pricing check is removed).
  const activeCardIdx = isOperate
    ? (() => {
        const n = eventLog.length;
        const raw = n % 6;
        return isImproved && raw === 2 ? 3 : raw;
      })()
    : -1;
  const prevCardIdx = isOperate ? (eventLog.length - 1) % 6 : -1;

  // Event color
  const eventColor = (type) => {
    switch (type) {
      case 'in':      return t.accent2 || '#2a4fd8';
      case 'out':     return t.accent1;
      case 'learn':   return t.accent1;
      case 'process': return t.text;
      default:        return t.text;
    }
  };
  const eventGlyph = (type) => {
    switch (type) {
      case 'in':      return '↘';
      case 'out':     return '↗';
      case 'learn':   return '✦';
      case 'process': return '◆';
      default:        return '·';
    }
  };

  return (
    <div style={{ width: '100%', maxWidth: 520, position: 'relative' }}>
      <div style={{ width: '100%', aspectRatio: '480 / 400', position: 'relative' }}>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100%" style={{ display: 'block', overflow: 'visible' }}>          <defs>
            <filter id="wmRough">
              <feTurbulence baseFrequency="0.02" numOctaves="2" seed="3"/>
              <feDisplacementMap in="SourceGraphic" scale="1.5"/>
            </filter>
            <radialGradient id="wmCardActive">
              <stop offset="0%" stopColor={t.accent1} stopOpacity="0.25"/>
              <stop offset="100%" stopColor={t.accent1} stopOpacity="0"/>
            </radialGradient>
          </defs>

          {/* Software window chrome */}
          <g opacity={morph}>
            <rect x="10" y="20" width={W - 20} height={H - 40} rx="10"
              fill="#ffffff" stroke={t.border} strokeWidth="1"/>
            <rect x="10" y="20" width={W - 20} height="32" rx="10" fill="#fafaf7"/>
            <rect x="10" y="44" width={W - 20} height="8" fill="#fafaf7"/>
            <circle cx="26" cy="36" r="4" fill="#ff5f57" opacity="0.7"/>
            <circle cx="40" cy="36" r="4" fill="#febc2e" opacity="0.7"/>
            <circle cx="54" cy="36" r="4" fill="#28c840" opacity="0.7"/>
            <text x={W/2} y="40" textAnchor="middle" fontFamily="'DM Mono', monospace"
              fontSize="9" fill={t.textMuted} letterSpacing="0.1em">CUSTOM INTAKE · BUILT FOR ACME CO</text>
            {/* Live indicator in operate phase */}
            {isOperate && (
              <g>
                <circle cx={W - 28} cy={36} r="3" fill={t.accent1}>
                  <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
                </circle>
                <text x={W - 38} y={39} textAnchor="end"
                  fontFamily="'DM Mono', monospace" fontSize="7"
                  letterSpacing="0.15em" fill={t.accent1}>LIVE</text>
              </g>
            )}
          </g>

          {/* Morphing nodes (cards) */}
          {sketchNodes.map((s, i) => {
            const tgt = targetCards[i];
            // Card #2 = "Pricing check" (s3) — gets removed in self-improvement
            const isRemovedCard = i === 2;
            const cardOpacity = isRemovedCard && isImproved
              ? Math.max(0, 1 - card3Fade)
              : 1;
            // Skip rendering completely once faded
            if (isRemovedCard && cardOpacity <= 0.01) return null;

            // Reflow: after removal, card #5 (target idx 5) shifts up to fill the gap visually
            // Keep simple — cards stay where they are, but the connections change.
            const x = lerp(s.sx, tgt.tx, morph);
            const y = lerp(s.sy, tgt.ty, morph);
            const w = lerp(s.sw, tgt.tw, morph);
            const h = lerp(s.sh, tgt.th, morph);
            const r = lerp(2, 8, morph);
            const drawn = sketchDraw > i * 0.15;
            const isActive = i === activeCardIdx && !(isRemovedCard && isImproved);
            // Flagging cue on card 3 right before removal
            const isFlagged = isRemovedCard && isFlagging;

            return (
              <g key={s.id} opacity={(drawn || morph > 0.1 ? 1 : 0) * cardOpacity} style={{ transition: 'opacity 0.3s' }}>
                {/* Flagged ring — pulses red/warn before removal */}
                {isFlagged && (
                  <rect x={x - 5} y={y - 5} width={w + 10} height={h + 10} rx={r + 3}
                    fill="none" stroke="#e84545" strokeOpacity="0.8" strokeWidth="1.5"
                    strokeDasharray="6 4">
                    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="0.6s" repeatCount="indefinite"/>
                  </rect>
                )}
                {/* Active card glow halo */}
                {isOperate && isActive && !isFlagged && (
                  <rect x={x - 4} y={y - 4} width={w + 8} height={h + 8} rx={r + 2}
                    fill="none" stroke={t.accent1} strokeOpacity="0.5" strokeWidth="1.5"/>
                )}
                <rect x={x} y={y} width={w} height={h} rx={r}
                  fill={
                    isFlagged ? '#fff5f5' :
                    isOperate && isActive ? '#fff8f1' :
                    morph > 0.3 ? '#ffffff' : 'transparent'
                  }
                  stroke={isFlagged ? '#e84545' : isOperate && isActive ? t.accent1 : t.text}
                  strokeOpacity={isFlagged ? 0.8 : isOperate && isActive ? 0.8 : lerp(0.7, 0.12, morph)}
                  strokeWidth={isFlagged || (isOperate && isActive) ? 1.5 : lerp(1.5, 1, morph)}
                  filter={morph < 0.3 ? 'url(#wmRough)' : ''}
                  style={{ transition: 'fill 0.25s, stroke 0.25s, stroke-opacity 0.25s, stroke-width 0.25s' }}
                />
                {morph < 0.5 && (
                  <text x={s.sx + s.sw/2} y={s.sy + 25} textAnchor="middle"
                    fontFamily="'Caveat', 'DM Sans', cursive"
                    fontSize="14" fill={t.text} fillOpacity={lerp(0.85, 0, morph * 2)}
                    style={{ fontStyle: 'italic' }}
                  >
                    {s.label.split('\n').map((line, j) => (
                      <tspan key={j} x={s.sx + s.sw/2} dy={j === 0 ? 0 : 16}>{line}</tspan>
                    ))}
                  </text>
                )}
                {morph > 0.5 && (
                  <g opacity={(morph - 0.5) * 2}>
                    <circle cx={x + 16} cy={y + 18} r="5" fill={t.accent1}/>
                    <rect x={x + 28} y={y + 14} width={Math.min(80, w - 50)} height="6" rx="2" fill={t.text} opacity="0.85"/>
                    <rect x={x + 28} y={y + 24} width={Math.min(50, w - 50)} height="4" rx="2" fill={t.text} opacity="0.3"/>
                    {h > 60 && (
                      <>
                        <rect x={x + 12} y={y + 40} width={w - 24} height="3" rx="1" fill={t.text} opacity="0.15"/>
                        <rect x={x + 12} y={y + 48} width={(w - 24) * 0.7} height="3" rx="1" fill={t.text} opacity="0.15"/>
                      </>
                    )}
                    {h > 80 && (
                      <>
                        <rect x={x + 12} y={y + 60} width="40" height="14" rx="3" fill={t.accent1} opacity={isActive ? 0.4 : 0.15}/>
                        <rect x={x + 56} y={y + 60} width="40" height="14" rx="3" fill={t.text} opacity="0.06"/>
                      </>
                    )}
                    {/* Status dot — pulses faster during operate */}
                    {isOperate && (
                      <circle cx={x + w - 14} cy={y + 18} r="3" fill={t.accent1}>
                        <animate attributeName="opacity" values="0.3;1;0.3" dur={isActive ? '0.6s' : '1.4s'} repeatCount="indefinite"/>
                      </circle>
                    )}
                  </g>
                )}
              </g>
            );
          })}

          {/* Connection paths */}
          {sketchPaths.map((p, i) => {
            const drawn = sketchDraw > 0.4 + i * 0.1;
            // Path 1 (idx 1): card 1 → card 2 (Pricing check). Removed after improvement.
            // Path 2 (idx 2): card 2 → card 3 (Email quote). Removed.
            // Add a NEW direct path: card 1 → card 3 (skipping pricing)
            const isPathToRemoved = i === 1 || i === 2;
            const isHighlightedFlag = isFlagging && isPathToRemoved;
            const pathFade = isPathToRemoved && isImproved
              ? Math.max(0, 1 - card3Fade)
              : 1;
            return (
              <g key={i} opacity={pathFade}>
                <path d={p.sd} fill="none"
                  stroke={t.text}
                  strokeOpacity={drawn ? lerp(0.55, 0, morph * 2) : 0}
                  strokeWidth="1.5"
                  filter="url(#wmRough)"
                  strokeLinecap="round"
                />
                <path d={p.td} fill="none"
                  stroke={isHighlightedFlag ? '#e84545' : t.accent1}
                  strokeOpacity={isHighlightedFlag ? 0.85 : lerp(0, isOperate ? 0.45 : 0.35, Math.max(0, (morph - 0.5) * 2))}
                  strokeWidth={isHighlightedFlag ? 1.8 : isOperate ? 1.2 : 1}
                  strokeDasharray={isOperate ? '4 3' : '3 3'}
                  style={{ transition: 'stroke 0.3s, stroke-opacity 0.3s, stroke-width 0.3s' }}
                />
              </g>
            );
          })}

          {/* New direct connection: bypasses pricing check after improvement */}
          {isImproved && (
            <path d="M 225 125 L 245 185"
              fill="none"
              stroke={t.accent1}
              strokeOpacity={Math.min(0.5, reflowProg * 0.5)}
              strokeWidth="1.5"
              strokeDasharray="4 3"
              style={{ transition: 'stroke-opacity 0.3s' }}
            />
          )}

          {/* High-velocity flow particles during operate — many, fast.
              Skips removed paths (1, 2) after improvement; uses bypass path. */}
          {isOperate && Array.from({ length: isImproved ? 16 : 12 }).map((_, i) => {
            // Build path pool — exclude removed paths after improvement, add bypass
            const activePaths = isImproved
              ? [
                  sketchPaths[0],
                  { td: 'M 225 125 L 245 185' }, // bypass: card 1 -> card 3
                  sketchPaths[3],
                  sketchPaths[4],
                ]
              : sketchPaths;
            const path = activePaths[i % activePaths.length];
            const m = path.td.match(/M ([\d.]+) ([\d.]+) L ([\d.]+) ([\d.]+)/);
            if (!m) return null;
            const [, x1, y1, x2, y2] = m.map(Number);
            const speed = isImproved ? 12 + (i % 3) * 3 : 18 + (i % 3) * 4;
            const phase01 = ((opTick + i * 5) % speed) / speed;
            const reverse = i % 4 === 0;
            const t2 = reverse ? 1 - phase01 : phase01;
            const px = lerp(+x1, +x2, t2);
            const py = lerp(+y1, +y2, t2);
            const colorPick = i % 3 === 0 ? t.accent2 : t.accent1;
            return (
              <g key={i}>
                <circle cx={px} cy={py} r="2.5" fill={colorPick} opacity="0.9"/>
                <circle cx={lerp(+x1, +x2, reverse ? Math.min(1, t2 + 0.08) : Math.max(0, t2 - 0.08))}
                  cy={lerp(+y1, +y2, reverse ? Math.min(1, t2 + 0.08) : Math.max(0, t2 - 0.08))}
                  r="1.5" fill={colorPick} opacity="0.4"/>
              </g>
            );
          })}

          {/* Re-architect flash: bright scan during the rewrite moment */}
          {isRewriting && (
            <rect x="10" y="20" width={W - 20} height={H - 40} rx="10"
              fill={t.accent1} opacity={0.08 * (1 - (opTick - IMPROVE_REWRITE) / (IMPROVE_DONE - IMPROVE_REWRITE))}/>
          )}

          {/* Version badge: appears after rewrite */}
          {isImproved && (
            <g opacity={Math.min(1, reflowProg * 2)}>
              <rect x={W - 60} y={H - 26} width={48} height={16} rx={3}
                fill={t.accent1} opacity="0.15"
                stroke={t.accent1} strokeOpacity="0.5" strokeWidth="0.8"/>
              <text x={W - 36} y={H - 15} textAnchor="middle"
                fontFamily="'DM Mono', monospace" fontSize="8"
                fontWeight="600" letterSpacing="0.1em" fill={t.accent1}>v1.1</text>
            </g>
          )}

          {/* AI scan line during build */}
          {morph > 0 && morph < 1 && (
            <line
              x1="10"
              x2={W - 10}
              y1={50 + (H - 100) * ((cycle - 60) / 120 % 1)}
              y2={50 + (H - 100) * ((cycle - 60) / 120 % 1)}
              stroke={t.accent1} strokeOpacity="0.35" strokeWidth="1"
              strokeDasharray="2 4"
            />
          )}

          {/* Operate-phase: floating live metric chip */}
          {isOperate && (
            <g>
              <rect x={W - 110} y={60} width={92} height={26} rx={4}
                fill="#ffffff" stroke={t.border} strokeWidth="1"/>
              <text x={W - 104} y={71} fontFamily="'DM Mono', monospace"
                fontSize="7" fill={t.textMuted} letterSpacing="0.1em">OPS / MIN</text>
              <text x={W - 104} y={82} fontFamily="'Epilogue', sans-serif"
                fontWeight="800" fontSize="11" fill={t.accent1}>{throughput}</text>
              <circle cx={W - 24} cy={73} r="3" fill={t.accent1}>
                <animate attributeName="opacity" values="0.4;1;0.4" dur="0.8s" repeatCount="indefinite"/>
              </circle>
            </g>
          )}
        </svg>

        {/* ── SKETCH → BUILD HANDOFF OVERLAY ────────────────
            Appears at the moment the whiteboard finishes drawing
            and the build agent starts working on it. */}
        {(() => {
          const SKETCH_START = 50;
          const SKETCH_END = 90;
          if (cycle < SKETCH_START || cycle >= SKETCH_END) return null;
          const local = (cycle - SKETCH_START) / (SKETCH_END - SKETCH_START);
          const overlayProg = local < 0.15 ? local / 0.15 : local > 0.85 ? Math.max(0, 1 - (local - 0.85) / 0.15) : 1;
          const sketchSteps = [
            { type: 'process', label: 'Whiteboard captured',     detail: '6 nodes · 5 connections', at: 50 },
            { type: 'process', label: 'Briefing build agent',    detail: 'context loaded', at: 64 },
            { type: 'out',     label: 'Starting build',          detail: 'generating custom software', at: 78 },
          ];
          return (
            <div style={{
              position: 'absolute',
              left: 16, top: 16,
              transform: `translateY(${(1 - overlayProg) * -8}px)`,
              opacity: overlayProg,
              width: 'min(60%, 320px)',
              background: 'rgba(255,255,255,0.97)',
              backdropFilter: 'blur(8px)',
              border: `1.5px solid ${t.accent1}`,
              borderRadius: 10,
              padding: '12px 14px',
              boxShadow: `0 10px 40px rgba(232,99,63,0.25), 0 0 0 6px rgba(232,99,63,0.06)`,
              fontFamily: "'DM Mono', monospace",
              fontSize: 11,
              transition: 'opacity 0.2s, transform 0.3s',
              pointerEvents: 'none',
              zIndex: 5,
            }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 8,
                paddingBottom: 10, marginBottom: 10,
                borderBottom: `1px solid ${t.border}`,
              }}>
                <span style={{
                  display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
                  background: t.accent1,
                  boxShadow: `0 0 12px ${t.accent1}`,
                  animation: 'wmPulse 0.8s infinite',
                }}/>
                <span style={{ fontSize: 10, letterSpacing: '0.18em', color: t.accent1, fontWeight: 700 }}>HANDOFF</span>
                <span style={{ flex: 1 }}/>
                <span style={{ fontSize: 9, color: t.textMuted, letterSpacing: '0.1em' }}>SKETCH → BUILD</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {sketchSteps.map((step, i) => {
                  const visible = cycle >= step.at;
                  if (!visible) return null;
                  const isCurrent = i === sketchSteps.length - 1 || cycle < sketchSteps[i + 1].at;
                  const glyph = step.type === 'out' ? '✓' : '◆';
                  const color = step.type === 'out' ? t.accent1 : t.text;
                  return (
                    <div key={i} style={{
                      display: 'flex', alignItems: 'baseline', gap: 10,
                      opacity: isCurrent ? 1 : 0.6,
                      transition: 'opacity 0.3s',
                    }}>
                      <span style={{ color, fontSize: 12, width: 14, flexShrink: 0, fontWeight: 700 }}>{glyph}</span>
                      <span style={{ color: t.text, fontWeight: 600, flexShrink: 0, whiteSpace: 'nowrap', fontSize: 11.5 }}>{step.label}</span>
                      <span style={{
                        color: t.textMuted, fontSize: 10,
                        whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                        flex: 1, minWidth: 0,
                      }}>· {step.detail}{isCurrent && tick % 2 === 0 ? '_' : ''}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* ── BUILD → OPERATE LAUNCH OVERLAY ────────────────
            Appears at the moment build completes & operate begins.
            Shows "Build 100% complete · launching operating agent". */}
        {(() => {
          // Window: cycle 170 (just before isOperate at 180) to 200 (~20 ticks into operate)
          const LAUNCH_START = 168;
          const LAUNCH_END = 230;
          if (cycle < LAUNCH_START || cycle >= LAUNCH_END) return null;
          const local = (cycle - LAUNCH_START) / (LAUNCH_END - LAUNCH_START);
          const overlayProg = local < 0.2 ? local / 0.2 : local > 0.85 ? Math.max(0, 1 - (local - 0.85) / 0.15) : 1;
          const launchSteps = [
            { type: 'process', label: 'Build complete',          detail: '100% · 14 minutes elapsed', at: 168 },
            { type: 'process', label: 'Validating workflows',    detail: '6 components · all healthy', at: 184 },
            { type: 'out',     label: 'Launching operating agent', detail: 'transitioning to live mode', at: 200 },
          ];
          return (
            <div style={{
              position: 'absolute',
              left: '50%', top: '50%',
              transform: `translate(-50%, -50%) scale(${0.92 + overlayProg * 0.08})`,
              opacity: overlayProg,
              width: 'min(86%, 380px)',
              background: 'rgba(255,255,255,0.97)',
              backdropFilter: 'blur(8px)',
              border: `1.5px solid ${t.accent1}`,
              borderRadius: 10,
              padding: '14px 16px',
              boxShadow: `0 10px 40px rgba(232,99,63,0.25), 0 0 0 6px rgba(232,99,63,0.06)`,
              fontFamily: "'DM Mono', monospace",
              fontSize: 11,
              transition: 'opacity 0.2s, transform 0.3s',
              pointerEvents: 'none',
              zIndex: 5,
            }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 8,
                paddingBottom: 10, marginBottom: 10,
                borderBottom: `1px solid ${t.border}`,
              }}>
                <span style={{
                  display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
                  background: t.accent1,
                  boxShadow: `0 0 12px ${t.accent1}`,
                  animation: 'wmPulse 0.8s infinite',
                }}/>
                <span style={{ fontSize: 10, letterSpacing: '0.18em', color: t.accent1, fontWeight: 700 }}>LAUNCHING</span>
                <span style={{ flex: 1 }}/>
                <span style={{ fontSize: 9, color: t.textMuted, letterSpacing: '0.1em' }}>BUILD → OPERATE</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {launchSteps.map((step, i) => {
                  const visible = cycle >= step.at;
                  if (!visible) return null;
                  const isCurrent = i === launchSteps.length - 1 || cycle < launchSteps[i + 1].at;
                  const glyph = step.type === 'out' ? '✓' : '◆';
                  const color = step.type === 'out' ? t.accent1 : t.text;
                  return (
                    <div key={i} style={{
                      display: 'flex', alignItems: 'baseline', gap: 10,
                      opacity: isCurrent ? 1 : 0.6,
                      transition: 'opacity 0.3s',
                    }}>
                      <span style={{ color, fontSize: 12, width: 14, flexShrink: 0, fontWeight: 700 }}>{glyph}</span>
                      <span style={{ color: t.text, fontWeight: 600, flexShrink: 0, whiteSpace: 'nowrap', fontSize: 11.5 }}>{step.label}</span>
                      <span style={{
                        color: t.textMuted, fontSize: 10,
                        whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                        flex: 1, minWidth: 0,
                      }}>· {step.detail}{isCurrent && tick % 2 === 0 ? '_' : ''}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {/* ── SELF-IMPROVEMENT OVERLAY ────────────────────── */}
        {isOperate && opTick >= IMPROVE_FLAG && opTick < IMPROVE_DONE + 30 && (() => {
          const overlayProg = opTick < IMPROVE_FLAG + 6
            ? (opTick - IMPROVE_FLAG) / 6
            : opTick > IMPROVE_DONE + 22
              ? Math.max(0, 1 - (opTick - IMPROVE_DONE - 22) / 8)
              : 1;
          const overlaySteps = [
            { type: 'learn',   label: 'Bottleneck detected',  detail: 'step 3 idle 87% of runs',     at: 130 },
            { type: 'learn',   label: 'Optimization found',   detail: 'pricing inferable from intake', at: 154 },
            { type: 'process', label: 'Re-architecting workflow', detail: 'v1.0 → v1.1 · removing step 3', at: 165 },
            { type: 'out',     label: 'Deployed',             detail: '0 downtime · +34% throughput', at: 188 },
          ];
          return (
            <div style={{
              position: 'absolute',
              left: '50%', top: '50%',
              transform: `translate(-50%, -50%) scale(${0.92 + overlayProg * 0.08})`,
              opacity: overlayProg,
              width: 'min(86%, 380px)',
              background: 'rgba(255,255,255,0.97)',
              backdropFilter: 'blur(8px)',
              border: `1.5px solid ${t.accent1}`,
              borderRadius: 10,
              padding: '14px 16px',
              boxShadow: `0 10px 40px rgba(232,99,63,0.25), 0 0 0 6px rgba(232,99,63,0.06)`,
              fontFamily: "'DM Mono', monospace",
              fontSize: 11,
              transition: 'opacity 0.2s, transform 0.3s',
              pointerEvents: 'none',
              zIndex: 5,
            }}>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 8,
                paddingBottom: 10, marginBottom: 10,
                borderBottom: `1px solid ${t.border}`,
              }}>
                <span style={{
                  display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
                  background: t.accent1,
                  boxShadow: `0 0 12px ${t.accent1}`,
                  animation: 'wmPulse 0.8s infinite',
                }}/>
                <span style={{
                  fontSize: 10, letterSpacing: '0.18em', color: t.accent1,
                  fontWeight: 700,
                }}>SELF-IMPROVEMENT</span>
                <span style={{ flex: 1 }}/>
                <span style={{ fontSize: 9, color: t.textMuted, letterSpacing: '0.1em' }}>
                  AGENT · LIVE
                </span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {overlaySteps.map((step, i) => {
                  const visible = opTick >= step.at;
                  if (!visible) return null;
                  const isCurrent = i === overlaySteps.length - 1 || opTick < overlaySteps[i + 1].at;
                  const glyph = step.type === 'learn' ? '✦' : step.type === 'process' ? '◆' : '✓';
                  const color = step.type === 'out' ? t.accent1 : step.type === 'process' ? t.text : t.accent1;
                  return (
                    <div key={i} style={{
                      display: 'flex', alignItems: 'baseline', gap: 10,
                      opacity: isCurrent ? 1 : 0.6,
                      transition: 'opacity 0.3s',
                    }}>
                      <span style={{ color, fontSize: 12, width: 14, flexShrink: 0, fontWeight: 700 }}>{glyph}</span>
                      <span style={{ color: t.text, fontWeight: 600, flexShrink: 0, whiteSpace: 'nowrap', fontSize: 11.5 }}>{step.label}</span>
                      <span style={{
                        color: t.textMuted, fontSize: 10,
                        whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                        flex: 1, minWidth: 0,
                      }}>· {step.detail}{isCurrent && tick % 2 === 0 ? '_' : ''}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}
      </div>

      {/* AGENT TERMINAL — switches mode when phase changes */}
      <div style={{
        marginTop: 18,
        background: t.bgCard,
        border: `1px solid ${t.border}`,
        borderRadius: 8,
        padding: '12px 14px',
        fontFamily: "'DM Mono', monospace",
        fontSize: 11,
        minHeight: 132,
        position: 'relative',
        overflow: 'hidden',
      }}>
        {/* Header — flips between BUILD and OPERATE agent */}
        <div style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          marginBottom: 10, paddingBottom: 8,
          borderBottom: `1px solid ${t.border}`,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{
              width: 6, height: 6, borderRadius: '50%',
              background: isOperate ? t.accent1 : t.accent2,
              boxShadow: `0 0 8px ${isOperate ? t.accent1 : t.accent2}`,
              animation: `wmPulse ${isOperate ? '0.6s' : '1.2s'} infinite`,
            }}/>
            <span style={{ color: t.textMuted, letterSpacing: '0.12em', fontSize: 10 }}>
              IX-FOUNDRY · {isBuild ? 'BUILD AGENT' : isOperate ? 'OPERATING AGENT' : 'AGENT'}
            </span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 10, color: t.textMuted, letterSpacing: '0.1em' }}>
            {isBuild && <span>{visibleBuildSteps.length}/{buildSteps.length}</span>}
            {isOperate && (
              <>
                <span>OPS <strong style={{ color: t.text, fontWeight: 600 }}>{Math.floor(ops).toLocaleString()}</strong></span>
                <span>LEARN <strong style={{ color: t.accent1, fontWeight: 600 }}>+{learnRate.toFixed(1)}%</strong></span>
              </>
            )}
          </div>
        </div>

        {/* BUILD: last 3 build steps */}
        {isBuild && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {visibleBuildSteps.slice(-3).map((step, i) => {
              const isCurrent = step === activeBuildStep;
              return (
                <div key={step.at} style={{
                  display: 'flex', alignItems: 'baseline', gap: 10,
                  opacity: isCurrent ? 1 : 0.55,
                  transition: 'opacity 0.3s',
                }}>
                  <span style={{
                    color: t.accent1, fontSize: 10, width: 12, flexShrink: 0,
                    opacity: isCurrent ? 1 : 0.7,
                  }}>
                    {isCurrent ? (tick % 4 < 2 ? '▸' : '▹') : '✓'}
                  </span>
                  <span style={{ color: t.text, fontWeight: 500, flexShrink: 0 }}>{step.label}</span>
                  <span style={{
                    color: t.textMuted, fontSize: 10,
                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>· {step.detail}{isCurrent && tick % 2 === 0 && '_'}</span>
                </div>
              );
            })}
          </div>
        )}

        {/* OPERATE: rolling event log — fast, varied */}
        {isOperate && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
            {recentEvents.map((evt, i) => {
              const isLatest = i === recentEvents.length - 1;
              const age = recentEvents.length - 1 - i;
              const opacity = isLatest ? 1 : Math.max(0.25, 0.85 - age * 0.2);
              const color = eventColor(evt.type);
              return (
                <div key={evt.idx} style={{
                  display: 'flex', alignItems: 'baseline', gap: 8,
                  opacity,
                  transform: isLatest ? 'translateX(0)' : 'translateX(0)',
                  transition: 'opacity 0.2s',
                }}>
                  <span style={{
                    color, fontSize: 11, width: 12, flexShrink: 0,
                    fontWeight: 700,
                  }}>{eventGlyph(evt.type)}</span>
                  <span style={{
                    fontSize: 9, color: t.textMuted, letterSpacing: '0.08em',
                    width: 52, flexShrink: 0,
                  }}>
                    {evt.type.toUpperCase().padEnd(7, ' ')}
                  </span>
                  <span style={{ color: t.text, fontWeight: 500, flexShrink: 0, whiteSpace: 'nowrap', minWidth: 110 }}>{evt.label}</span>
                  <span style={{
                    color: t.textMuted, fontSize: 10, minWidth: 0, flex: 1,
                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>· {evt.detail}</span>
                </div>
              );
            })}
            {/* blinking cursor on the new line */}
            <div style={{ color: t.accent1, fontSize: 11, opacity: tick % 2 === 0 ? 0.9 : 0.2 }}>▸_</div>
          </div>
        )}
      </div>

      <style>{`
        @keyframes wmPulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(1.5); }
        }
      `}</style>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────
function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('ix_tweaks') || '{}'); } catch { return {}; } })();
  const defaults = { ...TWEAK_DEFAULTS, ...saved };
  const [variant, setVariant] = React.useState(defaults.variant || 'forge');
  const [ctaStyle, setCtaStyle] = React.useState(defaults.ctaStyle || 'filled');

  const t = THEMES[variant] || THEMES.forge;

  // Persist to localStorage
  React.useEffect(() => {
    localStorage.setItem('ix_tweaks', JSON.stringify({ variant, ctaStyle }));
  }, [variant, ctaStyle]);

  // Tweaks panel wiring
  React.useEffect(() => {
    // Set up variants
    const variantContainer = document.getElementById('variant-options');
    if (variantContainer) {
      variantContainer.innerHTML = '';
      Object.entries(THEMES).forEach(([key, theme]) => {
        const btn = document.createElement('button');
        btn.className = 'tweak-btn' + (key === variant ? ' active' : '');
        btn.textContent = theme.name;
        btn.onclick = () => {
          setVariant(key);
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { variant: key } }, '*');
          document.querySelectorAll('#variant-options .tweak-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
        variantContainer.appendChild(btn);
      });
    }

    const ctaContainer = document.getElementById('cta-options');
    if (ctaContainer) {
      ctaContainer.innerHTML = '';
      [['filled', 'Filled button'], ['outline', 'Outline button']].forEach(([key, label]) => {
        const btn = document.createElement('button');
        btn.className = 'tweak-btn' + (key === ctaStyle ? ' active' : '');
        btn.textContent = label;
        btn.onclick = () => {
          setCtaStyle(key);
          window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { ctaStyle: key } }, '*');
          document.querySelectorAll('#cta-options .tweak-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
        ctaContainer.appendChild(btn);
      });
    }
  }, [variant, ctaStyle]);

  // Listen for tweaks panel messages
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') {
        document.getElementById('tweaks-panel').classList.add('open');
      }
      if (e.data?.type === '__deactivate_edit_mode') {
        document.getElementById('tweaks-panel').classList.remove('open');
      }
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <div style={{ background: t.bg }}>
      <Nav t={t} />
      <Hero t={t} ctaStyle={ctaStyle} />
      <Services t={t} />
      <Manifesto t={t} />
      <ClientStory t={t} />
      <Podcast t={t} />
      <Contact t={t} />
      <Careers t={t} />
      <Footer t={t} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
